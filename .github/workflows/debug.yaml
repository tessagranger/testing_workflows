name: Run Custom Functest
on:
  workflow_dispatch:
    inputs:
      test_names:
        description: "Test name(s)1"
        required: true
        type: string

      Asic:
        required: true
        type: choice
        options:
          - bristol
          - gibson
          - guild
          - tele
          - tele_2
          - squier
          - squier_3
          - rogue
      runs:
        description: "Number of runs per test"
        required: true
        type: string

      arq:
        description: "Architecture"
        required: true
        type: choice
        options:
          - x64
          - ARM64

      vdut:
        required: true
        type: boolean
        default: false

jobs:
  run-functest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Print values
        run: |
          echo "Test Name: ${{ github.event.inputs.test_names }}"
          echo "Esto es test branch: ${{ github.ref }}"
          echo "Esto es runs: ${{ github.event.inputs.runs }}"
          echo "Esto es Architecture: ${{ github.event.inputs.arq }}"
          echo "Esto es vdut: ${{ github.event.inputs.vdut }}"